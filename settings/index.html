<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b10"><title>OBITREND · Settings</title><style>*{box-sizing:border-box}body{margin:0;background:#080b10;color:#f5f5f5;font-family:Inter,system-ui,sans-serif}.wrap{width:min(720px,92vw);margin:auto;padding:28px 0}.top{display:flex;justify-content:space-between;align-items:center}.brand{color:#d4af37;font-weight:900;letter-spacing:.18em}.back,.action{background:#121722;color:#fff;border:1px solid #333b49;border-radius:11px;padding:10px 15px;font-weight:800}.panel{margin-top:40px;border:1px solid #2b3441;border-radius:18px;background:#0d121a;padding:8px 20px}.row{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:20px 0;border-bottom:1px solid #242c37}.row:last-child{border:0}.row span{display:block;color:#9aa3b1;font-size:13px;margin-top:5px}.danger{border-color:#694040;color:#ffbaba}@media(max-width:560px){.row{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><header class="top"><div class="brand">♛ OBITREND</div><button class="back" onclick="location.href='/'">← Back</button></header><section class="panel"><div class="row"><div><strong>Clear saved movie data</strong><span>Remove locally saved movie history and blueprint data.</span></div><button class="action" id="clear">Clear Cache</button></div><div class="row"><div><strong>Logout</strong><span>Sign out of the current movie creator session.</span></div><button class="action danger" id="logout">Logout</button></div></section></main><script type="module">import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm";const c=createClient("https://vjlitqujcujwsislprfg.supabase.co","sb_publishable_vxKAcrlrdZ3wfNH_n7EuZg_joZKejD6",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});document.getElementById("clear").onclick=()=>{["obitrend_movie_history","obitrend_movie_blueprint","obitrend_auto_movie_videos"].forEach(k=>localStorage.removeItem(k));alert("Saved movie data cleared.");};document.getElementById("logout").onclick=async()=>{await c.auth.signOut();location.href="/";};</script></body></html>
